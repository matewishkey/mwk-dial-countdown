<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Dial Timer</title>
		<!--
			sdpi-components is vendored rather than loaded from https://sdpi-components.dev (as the
			official template does) so the inspector works offline and the shipped plugin has no
			runtime dependency on a third-party host.
		-->
		<script src="sdpi-components.js"></script>
		<style>
			body {
				font-family: system-ui, sans-serif;
				font-size: 12px;
				color: #d8d8d8;
				margin: 0;
				padding: 8px;
			}

			p.hint {
				color: #969696;
				line-height: 1.5;
				margin: 4px 0 12px;
			}

			ul {
				list-style: none;
				margin: 0;
				padding: 0;
			}

			li {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 2px 0;
			}

			li.active input {
				border-color: #2d9cdb;
			}

			input {
				width: 70px;
				box-sizing: border-box;
				background: #2d2d2d;
				border: 1px solid #3d3d3d;
				border-radius: 3px;
				color: #d8d8d8;
				padding: 4px 6px;
				text-align: right;
			}

			.unit {
				color: #969696;
				flex: 1;
			}

			button {
				background: #3d3d3d;
				border: none;
				border-radius: 3px;
				color: #d8d8d8;
				padding: 4px 10px;
				cursor: pointer;
			}

			button:hover {
				background: #4d4d4d;
			}

			button.remove {
				padding: 2px 7px;
				background: none;
				color: #808080;
			}

			button.remove:hover {
				background: #3d3d3d;
				color: #d8d8d8;
			}

			.actions {
				margin-top: 10px;
			}
		</style>
	</head>
	<body>
		<p class="hint">
			Tap the touchscreen to cycle presets, press the dial to start or pause, hold it to reset. Turn to adjust in
			10&nbsp;second steps, or hold and turn for whole minutes — adjusting a stopped timer edits the preset here too.
		</p>

		<ul id="rows"></ul>

		<div class="actions">
			<button id="add" type="button">Add preset</button>
		</div>

		<script>
			const DEFAULTS = [5 * 60, 20 * 60, 30 * 60, 40 * 60];

			let presets = [];
			let presetIndex = 0;

			/**
			 * Settings are written on every edit rather than behind a Save button — Marketplace
			 * guidelines explicitly prohibit one in a property inspector.
			 */
			function save() {
				presetIndex = Math.min(presetIndex, presets.length - 1);
				SDPIComponents.streamDeckClient.setSettings({ presets, presetIndex });
				render();
			}

			function render() {
				const rows = document.getElementById("rows");
				rows.replaceChildren();

				presets.forEach((seconds, index) => {
					const row = document.createElement("li");
					if (index === presetIndex) {
						row.className = "active";
					}

					const minutes = document.createElement("input");
					minutes.type = "number";
					minutes.min = "0.1";
					minutes.step = "1";
					// Stored in seconds, edited in minutes — the fraction only shows when there is one.
					minutes.value = String(Math.round((seconds / 60) * 100) / 100);
					minutes.addEventListener("change", () => {
						const value = Math.max(1, Math.round((Number(minutes.value) || 0) * 60));
						presets[index] = value;
						save();
					});

					const unit = document.createElement("span");
					unit.className = "unit";
					unit.textContent = "minutes";

					row.append(minutes, unit);

					if (presets.length > 1) {
						const remove = document.createElement("button");
						remove.type = "button";
						remove.className = "remove";
						remove.textContent = "✕";
						remove.title = "Remove preset";
						remove.addEventListener("click", () => {
							presets.splice(index, 1);
							if (presetIndex >= presets.length) {
								presetIndex = 0;
							}
							save();
						});
						row.append(remove);
					}

					rows.append(row);
				});
			}

			document.getElementById("add").addEventListener("click", () => {
				presets.push(5 * 60);
				save();
			});

			/** Accepts both the current `number[]` shape and the older `{ label, seconds }[]` one. */
			function readPresets(value) {
				if (!Array.isArray(value) || value.length === 0) {
					return [...DEFAULTS];
				}
				const seconds = value
					.map((preset) => (typeof preset === "object" && preset !== null ? preset.seconds : preset))
					.filter((value) => typeof value === "number" && value > 0)
					.map((value) => Math.round(value));
				return seconds.length > 0 ? seconds : [...DEFAULTS];
			}

			SDPIComponents.streamDeckClient.getSettings().then(({ settings }) => {
				presets = readPresets(settings.presets);
				presetIndex = Number.isInteger(settings.presetIndex) ? settings.presetIndex : 0;
				render();
			});

			SDPIComponents.streamDeckClient.didReceiveSettings.subscribe(({ payload }) => {
				const settings = payload.settings ?? {};
				presets = readPresets(settings.presets);
				presetIndex = Number.isInteger(settings.presetIndex) ? settings.presetIndex : 0;
				render();
			});
		</script>
	</body>
</html>
